events {
    worker_connections 1024;
}

http {
    # 기본 설정
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # MIME 타입
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 로깅
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip 압축
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml;

    # 업스트림 정의
    upstream backend {
        server tablemaster-be:8080;
    }

    upstream frontend {
        server tablemaster-fe:3000;
    }

    upstream flutter {
        server tablemaster-app:80;
    }

    # ============================================
    # HTTP → HTTPS 리다이렉트 + ACME Challenge
    # ============================================
    server {
        listen 80;
        server_name clauminirockpt.tech api.clauminirockpt.tech app.clauminirockpt.tech;

        # Let's Encrypt ACME Challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # HTTPS로 리다이렉트
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ============================================
    # HTTPS - Backend API
    # ============================================
    server {
        listen 443 ssl;
        server_name api.clauminirockpt.tech;

        # SSL 인증서
        ssl_certificate /etc/letsencrypt/live/clauminirockpt.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/clauminirockpt.tech/privkey.pem;

        # SSL 설정
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        location / {
            proxy_pass http://backend;

            # 필수 헤더
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # WebSocket 지원 (STOMP/JWT 인증)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 타임아웃
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # ============================================
    # HTTPS - Flutter App
    # ============================================
    server {
        listen 443 ssl;
        server_name app.clauminirockpt.tech;

        # SSL 인증서
        ssl_certificate /etc/letsencrypt/live/clauminirockpt.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/clauminirockpt.tech/privkey.pem;

        # SSL 설정
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        location / {
            proxy_pass http://flutter;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }
    }

    # ============================================
    # HTTPS - Frontend (Next.js)
    # ============================================
    server {
        listen 443 ssl;
        server_name clauminirockpt.tech;

        # SSL 인증서
        ssl_certificate /etc/letsencrypt/live/clauminirockpt.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/clauminirockpt.tech/privkey.pem;

        # SSL 설정
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        location / {
            proxy_pass http://frontend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Next.js HMR WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # 기본 서버 (매칭 안 되는 요청)
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;

        # 기본 SSL (자체 서명 또는 dummy)
        ssl_certificate /etc/letsencrypt/live/clauminirockpt.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/clauminirockpt.tech/privkey.pem;

        location / {
            return 404;
        }
    }
}
