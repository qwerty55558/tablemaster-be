# ============================================
# 개발 환경 설정 (Development)
# ============================================

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  sql:
    init:
      mode: always
      data-locations: classpath:init.sql

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# JWT 시크릿 (개발용)
jwt:
  secret: dev-secret-key-must-be-at-least-256-bits-long-for-hs256

# 디바이스 인증 시크릿 (개발용)
device:
  app-secret: production-secret-key-must-be-changed

# 로깅 설정
logging:
  level:
    root: INFO
    com.mycompany.tablemaster: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
